<div class="grid grid-cols-2 gap-8 p-8 text-center sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8">
  @for (name of iconNames; track name) {
    <button
      type="button"
      class="group flex min-w-0 flex-col items-center gap-2 text-left cursor-pointer"
      [attr.aria-label]="'Copy ' + name + ' icon name'"
      (click)="copyIconName(name)"
    >
      <div
        class="relative flex aspect-square w-full items-center justify-center overflow-hidden rounded-lg border border-zinc-500 bg-zinc-900 text-zinc-950 shadow-sm transition-colors group-hover:border-zinc-300 group-focus-visible:border-zinc-400 group-focus-visible:outline group-focus-visible:outline-2 group-focus-visible:outline-offset-2 group-focus-visible:outline-zinc-500"
      >
        <ap-icon [name]="name" class="button-icon text-white" />
        <h5
          class="pointer-events-none absolute inset-0 flex items-center justify-center bg-zinc-950/80 px-3 text-center text-orange-400 opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100"
          [class.opacity-100]="copiedIconName() === name"
        >
          {{ copiedIconName() === name ? 'Copied!' : 'Copy name' }}
        </h5>
      </div>
      <h6 class="w-full truncate text-center text-zinc-300" [title]="name">{{ name }}</h6>
    </button>
  }
</div>
