<div class="flex items-center justify-between text-orange-400 px-6 py-4">
  <div class="flex w-full items-center justify-between">
    <h2 class="text-left">Radio Button</h2>
    <ap-select
      id="category-filter"
      class="ml-auto w-full max-w-xs"
      [options]="categoryOptions()"
      [showAllOption]="true"
      [selected]="selectedCategory()"
      placeholder="All Categories"
      (onSelect)="onCategoryChange($event)"
    />
  </div>
</div>
<div class="max-w-7xl mx-auto px-6 space-y-4">
  <ap-category-selection
    [categories]="filteredCategories()"
    [getCodeSnippet]="getCodeSnippet.bind(this)"
  >
    <ng-template #variantTemplate let-variant>
      <div
        class="p-4 flex flex-wrap items-center justify-center gap-4 min-h-[5rem]"
      >
        @for (option of variant.options; track option.value) {
          <ap-radio
            [name]="variant.groupName"
            [value]="option.value"
            [checked]="option.checked || false"
            [disabled]="option.disabled || false"
          >
            {{ option.label }}
          </ap-radio>
        }
      </div>
    </ng-template>
  </ap-category-selection>
</div>
