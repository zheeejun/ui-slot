@for (category of categories(); track category.title) {
  <div class="bg-zinc-800 p-4 rounded-2xl mb-4">
    <div
      class="flex items-center justify-between gap-4 border-b border-zinc-800/50"
    >
      <h3 class="text-zinc-100 text-center mb-2">{{ category.title }}</h3>
    </div>

    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    >
      @for (variant of category.variants; track variant.subtitle) {
        <div
          class="bg-gradient-to-b from-zinc-800/80 to-zinc-900/80 border border-zinc-700 rounded-2xl shadow-xl transition-all duration-300 hover:-translate-y-1"
        >
          <ng-container
            [ngTemplateOutlet]="variantTemplate() ?? null"
            [ngTemplateOutletContext]="{
              $implicit: variant,
              category: category,
            }"
          />
          <!-- Code preview -->
          <div
            class="p-4 border-t border-zinc-700/50 bg-zinc-900/60 rounded-b-2xl"
          >
            <p class="text-sm font-semibold text-zinc-200 mb-2">
              {{ variant.subtitle }}
            </p>
            <pre
              role="button"
              tabindex="0"
              [attr.aria-label]="'Copy ' + variant.subtitle + ' code snippet'"
              class="bg-zinc-950/60 text-orange-300 p-3 rounded-lg text-xs overflow-x-auto border border-zinc-800/50 font-mono leading-relaxed cursor-pointer transition-colors hover:border-orange-400/60 focus:outline-none focus:ring-2 focus:ring-orange-400/60"
              (click)="copyCodeSnippet(variant)"
              (keydown.enter)="copyCodeSnippet(variant)"
              (keydown.space)="
                copyCodeSnippet(variant); $event.preventDefault()
              "
            ><code>{{ copiedSnippet() === variant.subtitle ? "Copied" : getCodeSnippet()(variant) }}</code></pre>
          </div>
        </div>
      }
    </div>
  </div>
}
