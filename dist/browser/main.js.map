<label class="block">
  <div class="mb-1 flex justify-between text-xs text-slate-400">
    <div>{{ label() }}</div>
    <div>{{ value() }}{{ suffix() }}</div>
  </div>

  <input
    type="range"
    class="w-full cursor-pointer accent-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    (input)="updateValue($event)"
  />
</label>
