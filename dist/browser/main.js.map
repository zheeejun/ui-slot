<div class="flex items-center gap-2" [class.opacity-50]="disabled()">
  <input
    type="radio"
    [id]="radioId()"
    [name]="name()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange()"
    class="nav-icon text-zinc-700 dark:text-zinc-300 focus:ring-orange-500"
    [class.cursor-pointer]="!disabled()"
    [class.cursor-not-allowed]="disabled()"
  />
  <label
    [for]="radioId()"
    class="text-base leading-6 font-normal text-zinc-700 dark:text-white"
    [class.cursor-pointer]="!disabled()"
    [class.cursor-not-allowed]="disabled()"
  >
    <ng-content />
  </label>
</div>
