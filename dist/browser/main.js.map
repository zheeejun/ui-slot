<label
  class="inline-flex items-center cursor-pointer transition"
  [class]="wrapperHoverClass"
>
  <input
    type="checkbox"
    class="peer hidden"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="handleChange($event)"
  />
  <span
    class="relative flex items-center justify-center border border-zinc-300 shadow-sm transition peer-active:scale-90 dark:text-white"
    [class]="boxSizeClasses + ' ' + boxAccentClasses"
  >
    @if (checked()) {
      <ap-icon name="check" class="size-3/4 text-white" />
    }
  </span>
  @if (label()) {
    <span class="ml-1.5 text-white" [class]="labelSizeClasses">{{ label() }}</span>
  }
  <ng-content />
</label>
