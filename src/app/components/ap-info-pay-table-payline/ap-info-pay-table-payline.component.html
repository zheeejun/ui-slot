<div
  class="flex flex-col items-center p-1 rounded-lg"
  [ngClass]="backgroundColor()"
>
  <!-- Payline Number -->
  <div class="text-yellow-200 font-medium text-md mb-1">
    {{ paylineNumber() }}
  </div>

  <!-- Grid -->
  <div class="flex flex-col gap-1">
    @for (row of getGridRows(); track row) {
    <div class="flex gap-1">
      @for (col of getGridCols(); track col) {
      <div
        class="w-5 h-5 rounded transition-all duration-200 border border-zinc-600"
        [ngClass]="[
          isCellActive(row, col) ? activeCellColor() : inactiveCellColor()
        ]"
        (click)="onCellClick(row, col)"
      ></div>
      }
    </div>
    }
  </div>
</div>
