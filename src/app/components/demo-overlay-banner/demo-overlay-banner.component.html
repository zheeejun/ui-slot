
<div class="absolute top-0 flex items-center justify-center w-full h-16 bg-black opacity-75 duration-300 -mt-16" [ngClass]="{'mt-0': isOverlay()}">
  <div class="overflow-hidden whitespace-nowrap">
    <div class="inline-block animate-marquee">
      <span class="mx-4 text-xl font-bold text-white">🔥 限時活動開跑中！快來參加！🔥</span>
      <span class="mx-4 text-xl font-bold text-white">🔥 限時活動開跑中！快來參加！🔥</span>
      <span class="mx-4 text-xl font-bold text-white">🔥 限時活動開跑中！快來參加！🔥</span>
    </div>
  </div>    
</div>

<div class="absolute left-0 top-0 h-full w-70 -ml-70 duration-300 overflow-auto" [ngClass]="{'ml-0': isSidebar()}">
  <div class="relative flex flex-col w-full h-full p-4 gap-4 bg-linear-to-r from-black/75 to-black/0 ">
    <button (click)="setSidebar(false)" class="w-10 h-10 ml-auto flex items-center justify-center bg-gray-800 hover:bg-gray-700 rounded text-white active:scale-90 transition duration-100">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
    <img src="assets/images/csgo_block.png">
    <img src="assets/images/bestgame_block.png">
  </div>
</div>

<div class="absolute top-16 left-56 flex items-center justify-center gap-2">
  <button (click)="setSidebar(true)" class="w-12 h-12 p-3 rounded-full bg-gray-300 opacity-25 hover:bg-gray-200 hover:opacity-75 active:bg-gray-100">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5" />
    </svg>            
  </button>
  <button (click)="onOverlayClick()" class=" w-12 h-12 rounded-full p-3 bg-gray-300 opacity-25 hover:bg-gray-200 hover:opacity-75 active:bg-gray-100">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
</div>
