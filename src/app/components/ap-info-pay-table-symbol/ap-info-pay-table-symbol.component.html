<div
  class="flex flex-col items-center w-40 overflow-hidden"
  [ngClass]="[backgroundColor(), textColor()]"
>
  <!-- Symbol Image -->
  @if (symbolImage()) {
  <div class="w-full p-2 flex justify-center items-center">
    <img
      [src]="symbolImage() + `?v=${version()}`"
      [alt]="symbolName()"
      class="w-16 h-16 object-contain"
    />
  </div>
  }

  <!-- Table Header -->
  <div class="w-full grid grid-cols-2 font-medium sm:text-sm text-md">
    <div class="text-left py-2 px-2">{{ symbolHeader() }}</div>
    <div class="text-left text-yellow-200 py-2 px-2">
      {{ paylineHeader() }}
    </div>
  </div>

  <!-- Table Rows -->
  <div class="w-full">
    @for (row of tableData(); track $index) {
    <div
      class="grid grid-cols-2 divide-x-1 divide-zinc-700 border-collapse border border-zinc-700 sm:text-sm text-md hover:bg-zinc-800/50 transition-colors"
    >
      <div class="text-left py-2 px-3">{{ row.multiplier }}</div>
      <div class="text-left font-semibold py-2 px-3" [ngClass]="accentColor()">
        {{ row.payline }}
      </div>
    </div>
    }
  </div>
</div>
