<div
  class="relative w-[30rem] h-screen overflow-hidden bg-[url(assets/images/10065.png)] bg-cover bg-center bg-no-repeat flex flex-col items-center justify-between pt-12 pb-8"
>
  <!-- Black Overlay -->
  <div class="absolute inset-0 bg-black/50 z-0"></div>

  <!-- Countdown Timer -->
  <div class="relative z-overlay text-center mb-8 text-yellow-300">
    <div class="timer-label text-5xl font-black tracking-[0.2rem] mb-5">
      TIME LEFT
    </div>
    <div class="timer-value text-5xl font-black tracking-[0.3rem]">
      {{ timeLeft() }}
    </div>
  </div>

  <!-- Bottom Content -->
  <div class="relative z-overlay text-center">
    <!-- Progress Counter -->
    <div class="timer-label progress-counter text-5xl font-black text-white mb-4">
      {{ currentProgress() }}/{{ totalProgress() }}
    </div>
    <!-- Win Amount -->
    <div class="timer-label win-amount text-4xl font-black text-emerald-400">
      WIN {{ winAmount().toFixed(3) }}
    </div>
  </div>

  <!-- Falling Coins -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden">
    @for (coin of coins(); track coin.id) {
    <img
      [class]="
        coin.shouldRotate
          ? 'coin coin-rotate absolute object-contain cursor-pointer'
          : 'coin coin-no-rotate absolute object-contain cursor-pointer'
      "
      src="assets/images/coin.png"
      [style.left.%]="coin.left"
      [style.animation-delay.s]="coin.animationDelay"
      [style.animation-duration.s]="coin.animationDuration"
      [style.width.px]="coin.size"
      [style.height.px]="coin.size"
      [style.--sway-distance.px]="coin.swayDistance"
      (animationend)="handleAnimationEnd($event, coin.id)"
      (click)="onCoinClick(coin.id)"
      alt="coin"
    />
    }
  </div>
</div>
