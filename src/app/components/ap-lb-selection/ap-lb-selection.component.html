<div class="flex gap-4">
  @for (tab of tabs(); track tab.id) {
  <button
    class="flex items-start justify-center gap-2 px-4 py-2 rounded-lg border-2 transition-all duration-200 cursor-pointer min-w-36 text-center"
    [ngClass]="{
      'bg-yellow-400/15 border-yellow-400 text-yellow-400':
        selectedTab() === tab.id,
      'bg-zinc-900 border-zinc-600 text-zinc-400': selectedTab() !== tab.id
    }"
    (click)="onTabClick(tab.id)"
  >
    <div
      class="size-6 rounded-full border-2 flex items-center justify-center"
      [ngClass]="{
        'border-yellow-400 bg-yellow-900': selectedTab() === tab.id,
        'border-zinc-500 bg-zinc-700': selectedTab() !== tab.id
      }"
    >
      <div
        class="size-4 rounded-full"
        [ngClass]="{
          'bg-yellow-400': selectedTab() === tab.id,
          'bg-zinc-500': selectedTab() !== tab.id
        }"
      ></div>
    </div>
    <span class="font-semibold uppercase tracking-wide">{{ tab.label }}</span>
  </button>
  }
</div>
