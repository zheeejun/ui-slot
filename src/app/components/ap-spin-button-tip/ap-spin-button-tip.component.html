@if (label()) {
  <div
    class="size-full mx-auto flex items-center justify-center"
    style="
      background: linear-gradient(
        to right,
        rgba(234, 179, 8, 0) 0%,
        rgb(234, 179, 8) 50%,
        rgba(234, 179, 8, 0) 100%
      );
    "
  >
    <div class="text-white text-center tracking-wide text-stroke sm:text-2xl text-base font-semibold">
      {{ label() }}
    </div>
  </div>
}
