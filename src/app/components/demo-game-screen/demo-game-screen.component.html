<img
  src="assets/images/10087/01_FG/fg-bg_.png"
  class="relative size-full object-cover object-top"
/>

<!-- Replay Top Bar -->
@if (showReplayTopBar()) {
<div class="absolute top-0 left-0 w-full z-50">
  <ap-history-replay-top-bar />
</div>
} @if (variant() === 'desktop') {
<desktop
  class="absolute h-[600px] w-[1100px] top-1/2 left-1/2 -translate-1/2"
  [style.transform]="'scale(' + reelScale() + ') '"
/>
} @else if (variant() === 'mobile') {
<mobile
  class="absolute h-[600px] w-[400px] top-1/2 left-1/2 -translate-1/2"
  [style.transform]="'scale(' + reelScale() + ')'"
/>
}

<!-- Controls Input and Select - Centered -->
@if (showControls()) {
<div
  class="absolute top-[1%] left-1/2 -translate-x-1/2 flex items-center gap-2 text-zinc-100"
>
  <ap-input-box
    type="number"
    step="0.05"
    [value]="reelScale().toString()"
    (onInput)="onReelScaleChange($event)"
  />
  <ap-select
    [selected]="variant()"
    [options]="variantOptions"
    (onSelect)="variant.set($event)"
  />
</div>
}

<div class="absolute top-6 left-1 flex items-center gap-2 text-zinc-100">
  <span class="text-sm font-semibold">Show Controls</span>
  <ap-toggle-switch
    [checked]="showControls()"
    (checkedChange)="showControls.set($event)"
    [size]="'small'"
  />
</div>

<div class="absolute bottom-2 left-2 flex items-center gap-2 text-zinc-100">
  <span class="text-sm font-semibold">Show Replay Top Bar</span>
  <ap-toggle-switch
    [checked]="showReplayTopBar()"
    (checkedChange)="showReplayTopBar.set($event)"
    [size]="'small'"
  />
</div>
