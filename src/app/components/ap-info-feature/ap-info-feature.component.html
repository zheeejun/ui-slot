<div class="flex flex-col items-start p-6">
  <!-- Title -->
  <h4 class="mb-4 text-yellow-200">
    {{ title() }}
  </h4>

  <!-- Description -->
  <div class="mb-4 text-white">
    {{ description() }}
  </div>

  <!-- Symbol Images -->
  @if (variant() === "with-images" && symbolImages().length > 0) {
    <div class="flex flex-wrap gap-4 mt-2">
      @for (imagePath of symbolImages(); track imagePath) {
        <div class="flex items-center justify-center">
          <img
            [src]="imagePath + `?v=${version()}`"
            [alt]="'Symbol ' + ($index + 1)"
            class="object-contain w-20 h-20"
          />
        </div>
      }
    </div>
  }
</div>
