<div class="relative space-y-4">
  <h1>Game · 10098</h1>
  <p class="text-zinc-400">
    靜態展示遊戲（12P Football, 10098）視覺素材，純畫面呈現，不連接任何遊戲伺服器或帳號服務。
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (screen of screens; track screen.title) {
      <div class="rounded-xl overflow-hidden border border-yellow-400/50 bg-zinc-900">
        <img
          [src]="screen.image"
          [alt]="'Game 10098 - ' + screen.title"
          class="w-full h-auto block"
        />
        <div class="p-4 space-y-1">
          <h3 class="text-yellow-400">{{ screen.title }}</h3>
          <p class="text-zinc-400">Game ID 10098</p>
        </div>
      </div>
    }
  </div>
</div>
