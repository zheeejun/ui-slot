<!-- Card Title -->
<ap-ui-card-dev id="ap-trn-card-title" align="center">
  <div class="w-full">
    <div class="flex items-center justify-between px-6 py-4 text-orange-400">
      <h2 class="text-left">Game Title</h2>
    </div>
    <div class="mx-auto max-w-7xl space-y-4 px-6">
      <ap-category-selection
        [categories]="trnGameTitleCategories"
        [getCodeSnippet]="getTrnGameTitleSnippet.bind(this)"
      >
        <ng-template #variantTemplate let-variant>
          <div class="flex min-h-24 items-center justify-center p-4">
            <ap-trn-card-title
              class="block w-full"
              [accentColor]="variant.accentColor"
              [title]="variant.title"
              [size]="variant.size"
            />
          </div>
        </ng-template>
      </ap-category-selection>
    </div>
  </div>
</ap-ui-card-dev>
